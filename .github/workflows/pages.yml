name: Verify and deploy AI Practice Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify weekly challenge on PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$(id -un)"
          createdb weekly_test
          psql -X -v ON_ERROR_STOP=1 -d weekly_test -f tests/weekly.sql
      - run: python tests/content.py
      - run: python tests/knowledge.py
      - run: python site/projects/projects_test.py
      - run: node --test tests/engine.test.mjs tests/cloud.test.mjs
      - run: python tests/browser.py
      - run: python tests/corrections_browser.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
